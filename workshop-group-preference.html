<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>企業家經營班｜工作坊分組志願調查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#173150;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
.shell{max-width:790px;margin:auto;padding:25px 18px 60px}
.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:800;margin-bottom:20px}
.logo{display:grid;place-items:center;background:#173b65;color:white;width:36px;height:36px;border-radius:9px;font-size:19px}
.hero{background:linear-gradient(120deg,#12315a,#30577e);color:white;border-radius:20px;padding:27px 29px}
.eyebrow{font-size:12px;font-weight:750;letter-spacing:1px;color:#eabe70}
.hero h1{font-size:clamp(24px,4vw,32px);margin:12px 0}
.hero p{font-size:14px;line-height:1.8;margin:0;color:#f0f4fb}
.panel{background:white;border:1px solid #dfe6f0;border-radius:17px;padding:24px 27px;margin-top:16px}
h2{font-size:18px;margin:0 0 13px}.hint{font-size:14px;line-height:1.75;color:#5a6c83;margin:0 0 17px}
.progress{font-size:13px;font-weight:700;color:#875c22;background:#fff8ec;border-radius:9px;padding:11px 13px;margin-bottom:14px}
.topic-list{display:grid;gap:10px}
.topic-choice{display:flex;align-items:center;text-align:left;gap:13px;width:100%;margin:0;padding:17px 16px;border-radius:12px;border:1px solid #dce5f0;background:#fafdff;color:#183859;font:inherit;cursor:pointer;transition:background .15s,border-color .15s;touch-action:manipulation}
.topic-choice:focus-visible{outline:3px solid #a2bfeb}
.topic-choice:active{background:#eaf1fa}.topic-choice.chosen{background:#eef5ff;border-color:#99b7dc}
.topic-copy{flex:1;min-width:0}.topic-title{display:block;font-size:16px;font-weight:800;line-height:1.55}
.topic-desc{display:block;margin-top:5px;font-size:13px;font-weight:400;line-height:1.65;color:#5f7187}
.status{flex:0 0 85px;max-width:85px;padding:8px 5px;background:#173d6e;color:white;text-align:center;border-radius:9px;font-size:12px;font-weight:800;white-space:nowrap}
.status.empty{background:#eaf0f7;color:#446383}
.actions{display:flex;justify-content:flex-end;margin-top:12px}
.reset{width:auto;padding:9px 12px;border:none;border-radius:8px;background:#e9edf4;color:#335276;font-size:13px;font-weight:700;cursor:pointer}
.details{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:block;font-size:14px;font-weight:750}
.field input{width:100%;margin-top:8px;border:1px solid #c9d6e6;border-radius:9px;padding:12px;font-size:16px;font-family:inherit;color:#15385e}
.field input:focus{outline:2px solid #9cbee9}
#participant{width:100%;margin-top:9px;border:1px solid #c9d6e6;border-radius:9px;padding:13px 12px;background:#fff;font-size:16px;font-family:inherit;color:#15385e;max-width:100%;min-width:0}
#participant:focus{outline:2px solid #9cbee9}
.notice{font-size:13px;line-height:1.75;background:#fff7e9;border-left:3px solid #cfa158;padding:12px 14px;border-radius:5px;margin-top:18px}
.submit{display:block;width:100%;margin-top:20px;padding:14px;background:#cfa053;border:0;color:#142e50;font-size:16px;font-weight:800;border-radius:10px;cursor:pointer}
.submit:disabled{opacity:.52;cursor:default}
.feedback{margin-top:13px;font-size:14px;line-height:1.65}.feedback.good{color:#126b4d}.feedback.error{color:#a83232}
.footer{text-align:center;color:#78879b;font-size:12px;margin-top:20px}
@media(max-width:550px){.shell{padding:22px 15px 55px}.hero{padding:24px 20px}.panel{padding:21px 17px}.details{grid-template-columns:1fr}.topic-choice{padding:15px 12px;gap:9px}.status{flex-basis:73px;max-width:73px;font-size:11px}.topic-title{font-size:15px}.topic-desc{font-size:12px}}
</style></head><body>
<main class="shell">
<div class="brand"><span class="logo">K</span>凱基人壽｜企業家經營班</div>
<section class="hero"><div class="eyebrow">10/30 WORKSHOP</div><h1>工作坊分組志願調查</h1><p>工作坊仍以七週策略執行成果分享為主。請依最希望強化的經營主題，排出第一至第四順位。</p></section>
<section class="panel"><h2>四大經營主題｜點選排序</h2>
<p class="hint">請依喜好依序點選主題：<strong>第一次點選為第一順位</strong>，第二次為第二順位，以此類推。點選已選的主題可取消，重新安排。</p>
<div id="progress" class="progress" aria-live="polite">請點選最希望加強的第一順位主題</div>
<div id="topic-list" class="topic-list"></div>
<div class="actions"><button type="button" id="reset" class="reset">重新排序</button></div>
</section>
<form id="ranking-form" method="POST" target="submit-frame" action="https://script.google.com/macros/s/AKfycbzTQvqXxxbfxyFm9Q4oPf4-YzhEjdMDdfXD30cQdwrwMmyESQM_WiXHszairnmXm8Drfw/exec">
<section class="panel"><h2>基本資料</h2>
<label class="field" for="participant">處經理</label>
<select id="participant" required aria-required="true"><option value="">請選擇您的姓名</option></select>
<input type="hidden" name="unit" id="selected-unit">
<input type="hidden" name="name" id="selected-name">
<div class="notice">每組限9人；如優先順位額滿，將依後續順位安排。實際分組由主辦單位統籌決定。</div>
<div id="hidden-ranks"></div>
<input type="hidden" id="token" name="token">
<button class="submit" id="send" type="submit">確認順位並送出</button>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div>
</section></form>
<iframe title="背景提交" name="submit-frame" hidden></iframe>
<div class="footer">凱基人壽｜業務訓練部</div>
</main>
<script>
'use strict';
const themes=[
 {name:'人才育成與新人定著',desc:'聚焦新人啟專、育成輔導、活動養成與留存機制。'},
 {name:'願景領導與增員驅動',desc:'聚焦團隊願景、增員開口量、邀約行動與參與動能。'},
 {name:'經營複製與組織擴張',desc:'聚焦主管培育、經營模式複製與組織擴張。'},
 {name:'自律領導與團隊自主',desc:'聚焦以身作則、責任承擔與夥伴自主行動。'}
];
const participants=[["北一","台北一區","金彥","鄧睿宸"],["北一","台北一區","鴻海","林錦鴻"],["北一","台北二區","非凡","曾淑珍"],["北一","台北二區","創建","譚淑鋆"],["北一","台北二區","毅品","張雅如"],["北一","台北二區","越鋒","林采娥"],["北二","台北三區","駿廷","程廷鈞"],["北二","台北三區","昊陽","林浩筠"],["北二","台北三區","众山","呂敏淑"],["北二","台北三區","駿鋮","林宥成"],["北二","台北四區","東山","曾孝媛"],["北二","台北四區","展毓","嚴毓棟"],["北二","台北四區","崧峰","張啓峯"],["北二","台北四區","雙贏","許凱婷"],["桃竹","桃園區","金峰","呂秋蓉"],["桃竹","桃園區","虹燁","許雅虹"],["桃竹","桃園區","躍昇","許又臻"],["桃竹","桃園區","皇城","孫國城"],["桃竹","桃園區","瑞峰","蕭莉婷"],["桃竹","桃園區","瑞至","黃欣至"],["桃竹","新竹區","亞威","周淑娥"],["桃竹","新竹區","新竹直轄","沈秋吟"],["中嘉","台中一區","嘉銓","楊嘉麗"],["中嘉","台中一區","禾順","陳尹婷"],["中嘉","台中一區","福鵬直轄","黃傑揚"],["中嘉","台中二區","菁業","陳菁亮"],["中嘉","嘉義區","保富","呂敏忠"],["中嘉","嘉義區","上慶","邱慧娟"],["台南","台南一區","金美","樊光美"],["台南","台南一區","立捷","蘇雅俐"],["台南","台南一區","金達","洪淑娟"],["台南","台南二區","松慶","廖樹松"],["高屏","高屏一區","韋誠","沈鳳英"],["高屏","高屏一區","順誠","張婄吟"],["高屏","高屏二區","宏慶","陳澤坤"],["高屏","高屏二區","彩榮","梁麗琴"]];
const participantSelect=document.getElementById('participant');
participants.forEach((person,i)=>{
 const option=document.createElement('option');
 option.value=String(i);
 option.textContent=person.join('｜');
 participantSelect.appendChild(option);
});
participantSelect.addEventListener('change',()=>{
 const p=participantSelect.value===''?null:participants[Number(participantSelect.value)];
 document.getElementById('selected-unit').value=p?p[2]:'';
 document.getElementById('selected-name').value=p?p[3]:'';
});
const order=[];
const topicList=document.getElementById('topic-list');
const progress=document.getElementById('progress');
const feedback=document.getElementById('feedback');
const names=['第一','第二','第三','第四'];
function render(){
 topicList.replaceChildren();
 const arranged=[...order,...themes.map(t=>t.name).filter(n=>!order.includes(n))];
 for(const name of arranged){
  const t=themes.find(x=>x.name===name),rank=order.indexOf(name);
  const button=document.createElement('button');
  button.type='button';button.className='topic-choice'+(rank>=0?' chosen':'');
  button.setAttribute('aria-pressed',rank>=0?'true':'false');
  const copy=document.createElement('span');copy.className='topic-copy';
  const title=document.createElement('span');title.className='topic-title';title.textContent=t.name;
  const desc=document.createElement('span');desc.className='topic-desc';desc.textContent=t.desc;
  copy.append(title,desc);
  const badge=document.createElement('span');badge.className='status'+(rank<0?' empty':'');
  badge.textContent=rank<0?'點選排序':names[rank]+'順位';
  button.append(copy,badge);
  button.addEventListener('click',()=>{
   const n=order.indexOf(name);
   if(n>=0)order.splice(n,1);
   else if(order.length<4)order.push(name);
   feedback.textContent='';render();
  });
  topicList.append(button);
 }
 if(order.length===4)progress.textContent='四個順位已完成，請填寫基本資料並送出。';
 else progress.textContent='已選 '+order.length+'/4 項｜接下來請選擇'+names[order.length]+'順位';
 for(let i=1;i<=4;i++)document.getElementById('rank'+i).value=order[i-1]||'';
}
const hidden=document.getElementById('hidden-ranks');
for(let i=1;i<=4;i++){const el=document.createElement('input');el.type='hidden';el.id='rank'+i;el.name='rank'+i;hidden.append(el);}
document.getElementById('reset').addEventListener('click',()=>{order.length=0;feedback.textContent='';render();});
const form=document.getElementById('ranking-form'),send=document.getElementById('send');let pending='';
form.addEventListener('submit',e=>{
 if(!participantSelect.value){e.preventDefault();feedback.textContent='請先選擇您的姓名。';feedback.className='feedback error';return;}
 if(order.length!==4){e.preventDefault();feedback.textContent='請先完成四大主題的順位排序。';feedback.className='feedback error';window.scrollTo({top:topicList.getBoundingClientRect().top+window.scrollY-75,behavior:'smooth'});return;}
 if(pending){e.preventDefault();return;}
 pending=Date.now()+'-'+Math.random().toString(36).slice(2);
 document.getElementById('token').value=pending;
 send.disabled=true;send.textContent='送出中…';feedback.textContent='正在儲存分組志願…';feedback.className='feedback';
});
window.addEventListener('message',e=>{
 if(e.origin!=='https://script.google.com'&&!e.origin.endsWith('.googleusercontent.com'))return;
 if(!e.data||e.data.source!=='workshop-ranking'||e.data.token!==pending)return;
 pending='';send.disabled=false;send.textContent='確認順位並送出';
 feedback.textContent=e.data.message;feedback.className=e.data.ok?'feedback good':'feedback error';
});
render();
</script></body></html>
