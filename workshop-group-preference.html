<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>企業家經營班｜工作坊分組志願調查</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#173150;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.shell{max-width:790px;margin:auto;padding:25px 18px 60px}
.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:800;margin-bottom:20px}
.logo{display:grid;place-items:center;background:#173b65;color:#fff;width:36px;height:36px;border-radius:9px;font-size:19px}
.hero{background:linear-gradient(120deg,#12315a,#30577e);color:#fff;border-radius:20px;padding:27px 29px}
.eyebrow{font-size:12px;font-weight:750;letter-spacing:1px;color:#eabe70}
.hero h1{font-size:clamp(24px,4vw,32px);margin:12px 0}
.hero p{font-size:15px;line-height:1.8;margin:0;color:#f0f4fb}
.panel{background:#fff;border:1px solid #dfe6f0;border-radius:17px;padding:24px 27px;margin-top:16px}
h2{font-size:20px;margin:0 0 13px}
.hint{font-size:15px;line-height:1.75;color:#51647b;margin:0 0 17px}
.sort-list{display:flex;flex-direction:column;gap:12px}
.sort-card{display:grid;grid-template-columns:85px minmax(0,1fr) 39px;align-items:center;gap:14px;min-height:117px;padding:16px;border:2px solid var(--tone-border);border-radius:15px;background:var(--tone-bg);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;position:relative}
.sort-card[data-theme="0"]{--tone-bg:#ecf5fc;--tone-border:#c4deef;--tone-accent:#367ca4}
.sort-card[data-theme="1"]{--tone-bg:#fff5e7;--tone-border:#efd8b3;--tone-accent:#b17d2f}
.sort-card[data-theme="2"]{--tone-bg:#edf7f2;--tone-border:#c7e3d4;--tone-accent:#407c64}
.sort-card[data-theme="3"]{--tone-bg:#f3f0f9;--tone-border:#dcd2ee;--tone-accent:#75649e}
.sort-card.dragging{cursor:grabbing;opacity:.85;z-index:5;box-shadow:0 12px 28px #18375738;transition:none}
.sort-card.drop-target{outline:3px dashed var(--tone-accent);outline-offset:2px}
.sort-rank{border-radius:12px;background:var(--tone-accent);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 4px;min-height:79px}
.sort-rank strong{font-size:51px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}
.sort-rank span{font-size:12px;font-weight:800;margin-top:5px}
.sort-text{min-width:0}
.sort-name{font-size:19px;font-weight:850;line-height:1.45;margin:0 0 6px}
.sort-desc{font-size:14px;color:#50637a;line-height:1.65;margin:0}
.drag-icon{font-size:26px;line-height:1;color:var(--tone-accent);text-align:center;font-weight:700}
.sort-arrows{display:flex;gap:9px;justify-content:flex-end;margin-top:14px}
.sort-arrows button{background:#edf2f8;color:#183c66;border:0;border-radius:8px;padding:8px 11px;font-size:15px;font-weight:750;cursor:pointer;touch-action:manipulation}
.sort-arrows button:disabled{opacity:.35}
.sort-status{font-size:14px;font-weight:700;margin-top:13px;color:#37628c}
.field{display:block;font-size:16px;font-weight:800}
#region,#participant{width:100%;margin-top:9px;border:1px solid #c9d6e6;border-radius:9px;padding:14px 12px;background:#fff;font-size:17px;font-family:inherit;color:#15385e;max-width:100%;min-width:0}
#region:focus,#participant:focus{outline:2px solid #9cbee9}
.identity-field{margin-bottom:18px}.identity-note{font-size:13px;color:#6c7e92;margin:7px 0 0}#participant:disabled{background:#f4f6f8;color:#8a9db2}
.notice{font-size:14px;line-height:1.75;background:#fff7e9;border-left:3px solid #cfa158;padding:12px 14px;border-radius:5px;margin-top:18px}
.submit{display:block;width:100%;margin-top:20px;padding:15px;background:#cfa053;border:0;color:#142e50;font-size:17px;font-weight:800;border-radius:10px;cursor:pointer}
.submit:disabled{opacity:.52;cursor:default}
.feedback{margin-top:13px;font-size:14px;line-height:1.65}.feedback.good{color:#126b4d}.feedback.error{color:#a83232}
.footer{text-align:center;color:#78879b;font-size:12px;margin-top:20px}
@media(max-width:550px){
.shell{padding:22px 14px 55px}.hero{padding:24px 20px}.panel{padding:21px 14px}
.sort-card{grid-template-columns:63px minmax(0,1fr) 23px;padding:12px 10px;gap:10px;min-height:120px}
.sort-rank{min-height:75px}.sort-rank strong{font-size:47px}
.sort-name{font-size:17px}.sort-desc{font-size:14px}.drag-icon{font-size:21px}
}
</style></head><body>
<main class="shell">
<div class="brand"><span class="logo">K</span>凱基人壽｜企業家經營班</div>
<section class="hero"><div class="eyebrow">10/30 WORKSHOP</div><h1>工作坊分組志願調查</h1><p>工作坊仍以七週策略執行成果分享為主。請依最希望強化的經營主題，排出第一至第四順位。</p></section>
<section class="panel">
<h2>分組四大經營主題</h2>
<p class="hint">請<strong>按住主題卡片，上下拖動</strong>調整志願順序。最上方為<strong>第 1 順位</strong>，卡片左側數字會跟著改變。</p>
<div id="sort-list" class="sort-list" aria-label="工作坊四大主題志願順序"></div>
<p class="sort-status" id="sort-status" aria-live="polite">目前由上到下依序為第 1 至第 4 順位。</p>
</section>
<form id="ranking-form" method="POST" target="submit-frame" action="https://script.google.com/macros/s/AKfycbzTQvqXxxbfxyFm9Q4oPf4-YzhEjdMDdfXD30cQdwrwMmyESQM_WiXHszairnmXm8Drfw/exec">
<section class="panel"><h2>基本資料</h2>
<div class="identity-field"><label class="field" for="region">區域中心</label>
<select id="region" required aria-required="true"><option value="">請選擇區域中心</option></select></div>
<div class="identity-field"><label class="field" for="participant">單位＋姓名</label>
<select id="participant" required aria-required="true" disabled><option value="">請先選擇區域中心</option></select>
<p class="identity-note">選擇區域中心後，這裡只會顯示該區的單位與姓名。</p></div>
<input type="hidden" name="unit" id="selected-unit">
<input type="hidden" name="name" id="selected-name">
<div class="notice">每組限9人；如優先順位額滿，將依後續順位安排。實際分組由主辦單位統籌決定。</div>
<div id="hidden-ranks"></div>
<input type="hidden" id="token" name="token">
<button class="submit" id="send" type="submit">確認順位並送出</button>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div>
</section></form>
<iframe title="背景提交" name="submit-frame" hidden></iframe>
<div class="footer">凱基人壽｜業務訓練部</div>
</main>
<script>
'use strict';
const themes=[
 {name:'人才育成與新人定著',desc:'聚焦新人啟專、育成輔導、活動養成與留存機制。'},
 {name:'願景領導與增員驅動',desc:'聚焦團隊願景、增員開口量、邀約行動與參與動能。'},
 {name:'經營複製與組織擴張',desc:'聚焦主管培育、經營模式複製與組織擴張。'},
 {name:'自律領導與團隊自主',desc:'聚焦以身作則、責任承擔與夥伴自主行動。'}
];
const participants=[["北一","台北一區","金彥","鄧睿宸"],["北一","台北一區","鴻海","林錦鴻"],["北一","台北二區","非凡","曾淑珍"],["北一","台北二區","創建","譚淑鋆"],["北一","台北二區","毅品","張雅如"],["北一","台北二區","越鋒","林采娥"],["北二","台北三區","駿廷","程廷鈞"],["北二","台北三區","昊陽","林浩筠"],["北二","台北三區","众山","呂敏淑"],["北二","台北三區","駿鋮","林宥成"],["北二","台北四區","東山","曾孝媛"],["北二","台北四區","展毓","嚴毓棟"],["北二","台北四區","崧峰","張啓峯"],["北二","台北四區","雙贏","許凱婷"],["桃竹","桃園區","金峰","呂秋蓉"],["桃竹","桃園區","虹燁","許雅虹"],["桃竹","桃園區","躍昇","許又臻"],["桃竹","桃園區","皇城","孫國城"],["桃竹","桃園區","瑞峰","蕭莉婷"],["桃竹","桃園區","瑞至","黃欣至"],["桃竹","新竹區","亞威","周淑娥"],["桃竹","新竹區","新竹直轄","沈秋吟"],["中嘉","台中一區","嘉銓","楊嘉麗"],["中嘉","台中一區","禾順","陳尹婷"],["中嘉","台中一區","福鵬直轄","黃傑揚"],["中嘉","台中二區","菁業","陳菁亮"],["中嘉","嘉義區","保富","呂敏忠"],["中嘉","嘉義區","上慶","邱慧娟"],["台南","台南一區","金美","樊光美"],["台南","台南一區","立捷","蘇雅俐"],["台南","台南一區","金達","洪淑娟"],["台南","台南二區","松慶","廖樹松"],["高屏","高屏一區","韋誠","沈鳳英"],["高屏","高屏一區","順誠","張婄吟"],["高屏","高屏二區","宏慶","陳澤坤"],["高屏","高屏二區","彩榮","梁麗琴"]];
const regionSelect=document.getElementById('region');
const participantSelect=document.getElementById('participant');
[...new Set(participants.map(p=>p[0]))].forEach(region=>{
 const option=document.createElement('option');
 option.value=region;option.textContent=region;
 regionSelect.appendChild(option);
});
function clearSelectedParticipant(){
 document.getElementById('selected-unit').value='';
 document.getElementById('selected-name').value='';
}
regionSelect.addEventListener('change',()=>{
 participantSelect.replaceChildren();
 const placeholder=document.createElement('option');
 placeholder.value='';
 placeholder.textContent=regionSelect.value?'請選擇單位＋姓名':'請先選擇區域中心';
 participantSelect.appendChild(placeholder);
 clearSelectedParticipant();
 participantSelect.disabled=!regionSelect.value;
 if(!regionSelect.value)return;
 participants.forEach((person,i)=>{
  if(person[0]!==regionSelect.value)return;
  const option=document.createElement('option');
  option.value=String(i);
  option.textContent=person[2]+'｜'+person[3];
  participantSelect.appendChild(option);
 });
});
participantSelect.addEventListener('change',()=>{
 const p=participantSelect.value===''?null:participants[Number(participantSelect.value)];
 document.getElementById('selected-unit').value=p?p[2]:'';
 document.getElementById('selected-name').value=p?p[3]:'';
});
const sortList=document.getElementById('sort-list');
const status=document.getElementById('sort-status');
const hidden=document.getElementById('hidden-ranks');
const feedback=document.getElementById('feedback');
for(let i=1;i<=4;i++){
 const input=document.createElement('input');
 input.type='hidden';input.name='rank'+i;input.id='rank'+i;
 hidden.append(input);
}
function cards(){return [...sortList.querySelectorAll('.sort-card')];}
function updateRanks(){
 cards().forEach((card,i)=>{
  card.querySelector('.sort-rank strong').textContent=i+1;
  card.setAttribute('aria-label','第 '+(i+1)+' 順位：'+card.dataset.topic);
  document.getElementById('rank'+(i+1)).value=card.dataset.topic;
  card.querySelector('.up').disabled=i===0;
  card.querySelector('.down').disabled=i===3;
 });
 status.textContent='順位已更新｜從上到下依序為 1 → 2 → 3 → 4';
}
themes.forEach((theme,i)=>{
 const card=document.createElement('article');card.className='sort-card';
 card.dataset.theme=i;card.dataset.topic=theme.name;
 const badge=document.createElement('div');badge.className='sort-rank';
 const number=document.createElement('strong');badge.append(number);
 const word=document.createElement('span');word.textContent='順位';badge.append(word);
 const content=document.createElement('div');content.className='sort-text';
 const title=document.createElement('h3');title.className='sort-name';title.textContent=theme.name;
 const desc=document.createElement('p');desc.className='sort-desc';desc.textContent=theme.desc;
 content.append(title,desc);
 const handle=document.createElement('span');handle.className='drag-icon';handle.textContent='☰';handle.setAttribute('aria-hidden','true');
 const arrows=document.createElement('div');arrows.className='sort-arrows';
 const up=document.createElement('button');up.type='button';up.className='up';up.textContent='↑ 上移';up.setAttribute('aria-label',theme.name+'往上移');
 const down=document.createElement('button');down.type='button';down.className='down';down.textContent='↓ 下移';down.setAttribute('aria-label',theme.name+'往下移');
 arrows.append(up,down);content.append(arrows);card.append(badge,content,handle);sortList.append(card);
});
sortList.addEventListener('click',e=>{
 const b=e.target.closest('.up,.down');if(!b)return;
 const card=b.closest('.sort-card');
 const all=cards(),i=all.indexOf(card);
 if(b.classList.contains('up')&&i>0)sortList.insertBefore(card,all[i-1]);
 if(b.classList.contains('down')&&i<all.length-1)sortList.insertBefore(all[i+1],card);
 updateRanks();
});
let drag=null;
sortList.addEventListener('pointerdown',e=>{
 if(e.target.closest('button')||e.button!==0)return;
 const card=e.target.closest('.sort-card');if(!card)return;
 e.preventDefault();
 drag={card,pointerId:e.pointerId,startY:e.clientY,y:e.clientY,target:null,after:false};
 card.classList.add('dragging');
 card.setPointerCapture(e.pointerId);
});
sortList.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.pointerId)return;
 e.preventDefault();drag.y=e.clientY;
 const dy=Math.max(-200,Math.min(200,e.clientY-drag.startY));
 drag.card.style.transform='translateY('+dy+'px)';
 let target=null,after=false,min=Infinity;
 for(const candidate of cards()){
  if(candidate===drag.card)continue;
  const rect=candidate.getBoundingClientRect();
  const distance=Math.abs(e.clientY-(rect.top+rect.height/2));
  if(distance<min){min=distance;target=candidate;after=e.clientY>rect.top+rect.height/2;}
 }
 cards().forEach(c=>c.classList.remove('drop-target'));
 if(target)target.classList.add('drop-target');
 drag.target=target;drag.after=after;
});
function finishDrag(e,apply){
 if(!drag||e.pointerId!==drag.pointerId)return;
 const state=drag;drag=null;
 state.card.style.transform='';
 state.card.classList.remove('dragging');
 cards().forEach(c=>c.classList.remove('drop-target'));
 if(apply&&Math.abs(e.clientY-state.startY)>14&&state.target){
  sortList.insertBefore(state.card,state.after?state.target.nextSibling:state.target);
  updateRanks();
 }
}
sortList.addEventListener('pointerup',e=>finishDrag(e,true));
sortList.addEventListener('pointercancel',e=>finishDrag(e,false));
updateRanks();
const form=document.getElementById('ranking-form'),send=document.getElementById('send');let pending='';
form.addEventListener('submit',e=>{
 if(!regionSelect.value||!participantSelect.value){e.preventDefault();feedback.textContent='請先選擇區域中心與單位＋姓名。';feedback.className='feedback error';return;}
 if(cards().length!==4){e.preventDefault();feedback.textContent='主題排序尚未完成。';feedback.className='feedback error';return;}
 if(pending){e.preventDefault();return;}
 pending=Date.now()+'-'+Math.random().toString(36).slice(2);
 document.getElementById('token').value=pending;
 send.disabled=true;send.textContent='送出中…';feedback.textContent='正在儲存分組志願…';feedback.className='feedback';
});
window.addEventListener('message',e=>{
 if(e.origin!=='https://script.google.com'&&!e.origin.endsWith('.googleusercontent.com'))return;
 if(!e.data||e.data.source!=='workshop-ranking'||e.data.token!==pending)return;
 pending='';send.disabled=false;send.textContent='確認順位並送出';
 feedback.textContent=e.data.message;feedback.className=e.data.ok?'feedback good':'feedback error';
});
</script></body></html>
