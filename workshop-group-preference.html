<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>企業家經營班｜工作坊分組志願調查</title>
<style>
:root{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;color:#1b3050;background:#f5f7fb}*{box-sizing:border-box}
body{margin:0}.shell{max-width:790px;margin:0 auto;padding:28px 18px 60px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;margin-bottom:20px;color:#16345c}.mark{display:grid;place-items:center;background:#183961;color:#fff;font-size:19px;width:36px;height:36px;border-radius:9px}
.hero{background:linear-gradient(115deg,#112e55,#275076);border-radius:19px;padding:27px 30px;color:#fff}
.eyebrow{color:#edba66;font-size:12px;letter-spacing:1px;font-weight:800}.hero h1{font-size:clamp(24px,4vw,32px);margin:10px 0}.hero p{font-size:14px;line-height:1.8;margin:0;color:#e7eff9}
.panel{background:white;border:1px solid #e1e7f0;border-radius:17px;padding:24px 28px;margin-top:16px}
h2{font-size:18px;margin:0 0 15px}.info{font-size:13px;line-height:1.8;color:#57677a;margin:0 0 14px}
.details{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:14px;font-weight:700;display:block}
input,select{width:100%;background:#fff;margin-top:8px;border:1px solid #c9d4e2;border-radius:9px;padding:13px;font:inherit;font-size:14px;color:#1b3050}
input:focus,select:focus{outline:2px solid #a3c2f5;border-color:#3975c2}
.rank{display:grid;grid-template-columns:115px 1fr;align-items:center;gap:15px;margin:13px 0}.rank b{font-size:14px}.rank select{margin:0}
.notice{background:#fff8eb;border-left:3px solid #d2a259;border-radius:6px;padding:12px 15px;margin-top:19px;font-size:13px;line-height:1.8}
button{background:#d5a04a;color:#122b4f;border:0;border-radius:10px;width:100%;padding:14px;font-size:16px;font-weight:800;cursor:pointer;margin-top:21px}
button:disabled{opacity:.45;cursor:wait}.feedback{font-size:14px;line-height:1.7;margin-top:14px}.feedback.good{color:#116d4a}.feedback.error{color:#ac3434}
.footer{text-align:center;margin-top:19px;font-size:12px;color:#718199}
@media(max-width:520px){.hero{padding:24px 20px}.panel{padding:21px 18px}.details{grid-template-columns:1fr}.rank{grid-template-columns:1fr;gap:7px}}
</style></head><body>
<main class="shell">
<div class="brand"><span class="mark">K</span>凱基人壽｜企業家經營班</div>
<section class="hero"><div class="eyebrow">10/30 WORKSHOP</div><h1>工作坊分組志願調查</h1>
<p>工作坊仍以七週策略執行成果分享為主。請依最希望強化的經營主題，填寫第一至第四順位。</p></section>
<form id="ranking-form" method="POST" target="submit-frame" action="https://script.google.com/macros/s/AKfycbzcp0TplgEj1odkybyvZqJlzg5tjjFnbJD0MClY2vCOpE0qxuDDhP3nzdB2F4XcOuLcXA/exec">
<section class="panel"><h2>基本資料</h2>
<div class="details"><label>通訊處<input name="unit" required maxlength="70" placeholder="請輸入通訊處名稱" autocomplete="organization"></label>
<label>處經理姓名<input name="name" required maxlength="70" placeholder="請輸入姓名" autocomplete="name"></label></div></section>
<section class="panel"><h2>四大主題志願排序</h2>
<p class="info">每個主題只能選擇一次，請依想加強的優先順序排列。</p>
<div id="ranks"></div>
<div class="notice">每組限9人；如優先順位額滿，將依後續順位安排。實際分組由主辦單位統籌決定。</div>
<input type="hidden" name="token" id="token">
<button type="submit" id="send">送出分組志願</button>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div>
</section></form>
<iframe name="submit-frame" id="submit-frame" title="背景提交" hidden></iframe>
<div class="footer">凱基人壽｜業務訓練部</div>
</main>
<script>
const topics=['人才育成與新人定著','願景領導與增員驅動','經營複製與組織擴張','自律領導與團隊自主'];
const holder=document.getElementById('ranks');
for(let i=1;i<=4;i++){
 const row=document.createElement('div');row.className='rank';
 const label=document.createElement('label');label.htmlFor='rank'+i;label.textContent=['','第一順位','第二順位','第三順位','第四順位'][i];
 const select=document.createElement('select');select.id='rank'+i;select.name='rank'+i;select.required=true;
 select.innerHTML='<option value="">請選擇主題</option>';
 for(const t of topics){const op=document.createElement('option');op.value=t;op.textContent=t;select.appendChild(op);}
 select.addEventListener('change',syncChoices);row.append(label,select);holder.appendChild(row);
}
function syncChoices(){
 const selects=[...holder.querySelectorAll('select')];
 const selected=selects.map(s=>s.value).filter(Boolean);
 for(const s of selects)for(const opt of [...s.options]){
   if(!opt.value)continue;opt.disabled=selected.includes(opt.value)&&opt.value!==s.value;
 }
}
const form=document.getElementById('ranking-form'),btn=document.getElementById('send'),feed=document.getElementById('feedback');
let awaiting='';
form.addEventListener('submit',e=>{
 const ranks=[1,2,3,4].map(i=>document.getElementById('rank'+i).value);
 if(new Set(ranks).size!==4||ranks.some(v=>!v)){e.preventDefault();feed.textContent='請將四個主題分別排入第一至第四順位。';feed.className='feedback error';return;}
 if(awaiting){e.preventDefault();return;}
 awaiting=(Date.now()+'-'+Math.random().toString(36).slice(2));
 document.getElementById('token').value=awaiting;
 btn.disabled=true;btn.textContent='傳送中…';feed.textContent='正在儲存分組意願…';feed.className='feedback';
});
window.addEventListener('message',e=>{
 if(!e.data||e.data.source!=='workshop-ranking'||e.data.token!==awaiting)return;
 awaiting='';btn.disabled=false;btn.textContent='送出分組志願';
 feed.textContent=e.data.message;feed.className=e.data.ok?'feedback good':'feedback error';
});
</script></body></html>
