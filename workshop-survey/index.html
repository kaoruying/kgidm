<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10/30 工作坊滿意度調查｜企業家經營班</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172b4d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.top{background:#071d42;color:white;padding:30px 20px 42px;text-align:center}.eyebrow{color:#e3bd78;font-size:12px;letter-spacing:3px}.top h1{font-size:clamp(25px,5vw,38px);margin:12px 0}.top p{color:#d9e3f1;font-size:14px}.wrap{max-width:740px;margin:-22px auto 45px;padding:0 15px}.panel{background:white;border-radius:18px;box-shadow:0 12px 40px #102f5815;padding:clamp(22px,5vw,38px)}.intro{line-height:1.85;color:#506078;font-size:14px}.section{margin-top:30px;border-top:1px solid #e6ebf2;padding-top:23px}.section h2{font-size:17px;margin:0 0 17px}.num{color:#b88c45;margin-right:9px}.question{margin:22px 0}.question label{font-weight:650;display:block;line-height:1.7;margin-bottom:12px}small{color:#718198}.scale{display:flex;flex-wrap:wrap;gap:7px}.scale input{position:absolute;opacity:0}.scale label{display:grid;place-items:center;width:43px;height:43px;border:1px solid #d5deea;border-radius:10px;margin:0;cursor:pointer;font-weight:650;color:#345}.scale input:checked+label{background:#0d356c;color:#fff;border-color:#0d356c}.scale input:focus-visible+label{outline:3px solid #c9a56b}textarea,input[type=text]{width:100%;font:inherit;border:1px solid #ccd7e5;border-radius:10px;padding:13px;outline:none}textarea{min-height:108px;resize:vertical}textarea:focus,input[type=text]:focus{border-color:#285e9d}.required{color:#bc6c39}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}button{font:inherit;border-radius:10px;padding:14px 20px;cursor:pointer;border:1px solid #0d356c;background:#0d356c;color:white;font-weight:700}button.secondary{background:white;color:#0d356c}.notice{background:#f6f8fb;border-radius:10px;padding:13px;margin-top:18px;color:#5a6a7d;font-size:13px;line-height:1.7}.status{margin-top:14px;font-weight:650;color:#176049}footer{text-align:center;color:#73829b;font-size:12px;padding:12px 0 35px}@media(max-width:420px){.scale label{width:calc((100vw - 90px)/5);max-width:48px}.panel{padding:20px}.top{padding-bottom:45px}}</style></head><body><header class="top"><div class="eyebrow">KGI LIFE · WORKSHOP 01</div><h1>企業家經營班<br>工作坊滿意度調查</h1><p>2026.10.30｜從實踐交流，走向經營成長</p></header><main class="wrap"><div class="panel"><p class="intro">感謝您參與本次工作坊！誠摯邀請您分享學習收穫與真實建議，作為 12/3 第二次工作坊內容規劃與活動優化的重要參考。填寫時間約 3 分鐘。</p><form id="survey"><section class="section"><h2><span class="num">01</span>基本資料</h2><div class="question"><label for="unit">通訊處 <span class="required">*</span></label><input id="unit" name="unit" type="text" required placeholder="請輸入通訊處"></div><div class="question"><label for="name">姓名 <span class="required">*</span></label><input id="name" name="name" type="text" required placeholder="請輸入姓名"></div></section><section class="section"><h2><span class="num">02</span>工作坊滿意度</h2><small>請依實際感受評分，1 分最低、10 分最高。</small><div id="ratingQuestions"></div></section><section class="section"><h2><span class="num">03</span>學習收穫與下次期待</h2><div class="question"><label for="gain">4. 本次工作坊最大的收穫是什麼？有哪些值得帶回通訊處實際運用的做法？</label><textarea id="gain" name="gain" placeholder="請分享您的學習收穫與應用想法……"></textarea></div><div class="question"><label for="next">5. 對於 12/3 第二次工作坊，您希望深入討論哪些經營課題？或對活動安排有什麼期待與建議？</label><textarea id="next" name="next" placeholder="歡迎提出您的期待與建議……"></textarea></div></section><div class="actions"><button type="submit">完成填寫・下載回覆</button><button type="button" class="secondary" id="copy">複製回覆</button></div><div class="notice">目前為問卷頁面預覽版，尚未連接正式回覆資料庫。點選「完成填寫」會將答案下載至您的裝置，不會自動傳送給業務訓練部。</div><div id="status" class="status" role="status" aria-live="polite"></div></form></div></main><footer>凱基人壽｜業務訓練部</footer><script>const qs=['本次工作坊整體滿意程度？','本次工作坊的個案分享與同儕交流，對您在通訊處經營上的幫助程度？','本次工作坊引導師的回饋與建議，對您解決實際經營問題的幫助程度？'];document.getElementById('ratingQuestions').innerHTML=qs.map((q,i)=>'<div class="question"><label id="q'+i+'">'+(i+1)+'. '+q+' <span class="required">*</span></label><div class="scale" role="group" aria-labelledby="q'+i+'">'+Array.from({length:10},(_,j)=>'<input required type="radio" name="rating'+i+'" id="r'+i+'-'+(j+1)+'" value="'+(j+1)+'"><label for="r'+i+'-'+(j+1)+'">'+(j+1)+'</label>').join('')+'</div></div>').join('');const form=document.getElementById('survey'),status=document.getElementById('status');function payload(){const d=new FormData(form);return '企業家經營班｜10/30 工作坊滿意度調查\n填寫時間：'+new Date().toLocaleString('zh-TW')+'\n通訊處：'+d.get('unit')+'\n姓名：'+d.get('name')+'\n'+qs.map((q,i)=>(i+1)+'. '+q+' '+d.get('rating'+i)+'/10').join('\n')+'\n4. 學習收穫：'+(d.get('gain')||'')+'\n5. 下次工作坊期待與建議：'+(d.get('next')||'')}form.addEventListener('submit',e=>{e.preventDefault();const blob=new Blob(['\ufeff'+payload()],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='工作坊問卷_'+String(new FormData(form).get('name')).replace(/[\\/:*?"<>|]/g,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent='已下載回覆檔案；目前尚未自動送出。'});document.getElementById('copy').addEventListener('click',async()=>{if(!form.reportValidity())return;try{await navigator.clipboard.writeText(payload());status.textContent='已複製回覆內容。'}catch{status.textContent='複製失敗，請使用下載回覆功能。'}})</script></body></html>
