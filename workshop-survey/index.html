<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10/30 工作坊滿意度調查｜企業家經營班</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172b4d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.top{background:#071d42;color:white;padding:30px 20px 42px;text-align:center}.eyebrow{color:#e3bd78;font-size:12px;letter-spacing:3px}.top h1{font-size:clamp(25px,5vw,38px);margin:12px 0}.top p{color:#d9e3f1;font-size:14px}.wrap{max-width:740px;margin:-22px auto 45px;padding:0 15px}.panel{background:white;border-radius:18px;box-shadow:0 12px 40px #102f5815;padding:clamp(22px,5vw,38px)}.intro{line-height:1.85;color:#506078;font-size:14px}.section{margin-top:30px;border-top:1px solid #e6ebf2;padding-top:23px}.section h2{font-size:17px;margin:0 0 17px}.num{color:#b88c45;margin-right:9px}.question{margin:22px 0}.question label{font-weight:650;display:block;line-height:1.7;margin-bottom:12px}small{color:#718198}.scale{display:flex;flex-wrap:wrap;gap:7px}.scale input{position:absolute;opacity:0}.scale label{display:grid;place-items:center;width:43px;height:43px;border:1px solid #d5deea;border-radius:10px;margin:0;cursor:pointer;font-weight:650;color:#345}.scale input:checked+label{background:#0d356c;color:#fff;border-color:#0d356c}.scale input:focus-visible+label{outline:3px solid #c9a56b}textarea,select,input[type=text]{width:100%;font:inherit;border:1px solid #ccd7e5;border-radius:10px;padding:13px;outline:none}textarea{min-height:108px;resize:vertical}textarea:focus,input[type=text]:focus{border-color:#285e9d}.required{color:#bc6c39}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}button{font:inherit;border-radius:10px;padding:14px 20px;cursor:pointer;border:1px solid #0d356c;background:#0d356c;color:white;font-weight:700}button.secondary{background:white;color:#0d356c}.notice{background:#f6f8fb;border-radius:10px;padding:13px;margin-top:18px;color:#5a6a7d;font-size:13px;line-height:1.7}.status{margin-top:14px;font-weight:650;color:#176049}footer{text-align:center;color:#73829b;font-size:12px;padding:12px 0 35px}@media(max-width:420px){.scale label{width:calc((100vw - 90px)/5);max-width:48px}.panel{padding:20px}.top{padding-bottom:45px}}</style></head><body><header class="top"><div class="eyebrow">KGI LIFE · WORKSHOP 01</div><h1>企業家經營班<br>工作坊滿意度調查</h1><p>2026.10.30｜從實踐交流，走向經營成長</p></header><main class="wrap"><div class="panel"><p class="intro">感謝您參與本次工作坊！誠摯邀請您分享學習收穫與真實建議，作為 12/3 第二次工作坊內容規劃與活動優化的重要參考。填寫時間約 3 分鐘。</p><form id="survey"><section class="section"><h2><span class="num">01</span>基本資料</h2><div class="question"><label for="center">區域中心 <span class="required">*</span></label><select id="center" name="center" required><option value="">請選擇區域中心</option><option>北一</option><option>北二</option><option>桃竹</option><option>中嘉</option><option>台南</option><option>高屏</option></select></div><div class="question"><label for="participant">通訊處／姓名 <span class="required">*</span></label><select id="participant" required disabled><option value="">請先選擇區域中心</option></select></div><input type="hidden" name="unit" id="unit"><input type="hidden" name="name" id="name"></section><section class="section"><h2><span class="num">02</span>工作坊滿意度</h2><small>請依實際感受評分，1 分最低、5 分最高。</small><div id="ratingQuestions"></div></section><section class="section"><h2><span class="num">03</span>學習收穫與下次期待</h2><div class="question"><label for="gain">3. 本次工作坊最大的收穫是什麼？有哪些值得帶回通訊處實際運用的做法？</label><textarea id="gain" name="gain" placeholder="請分享您的學習收穫與應用想法……"></textarea></div><div class="question"><label for="next">4. 對於 12/3 第二次工作坊，您希望深入討論哪些經營課題？或對活動安排有什麼期待與建議？</label><textarea id="next" name="next" placeholder="歡迎提出您的期待與建議……"></textarea></div></section><div class="actions"><button type="submit">送出問卷</button></div><div class="notice">目前仍待設定工作坊專用的問卷接收端，正式啟用後才能送出並儲存回覆。</div><div id="status" class="status" role="status" aria-live="polite"></div></form></div></main><footer>凱基人壽｜業務訓練部</footer><script>
const rosterByRegion={
    '北一':[
      ['鴻海','林錦鴻'],['越鋒','林采娥'],['創建','譚淑鋆'],['毅品','張雅如'],['非凡','曾淑珍'],['金彥','鄧睿宸']
    ],
    '北二':[
      ['駿廷','程廷鈞'],['東山','曾孝媛'],['雙贏','許凱婷'],['駿鋮','林宥成'],['崧峰','張啓峰'],['众山','呂敏淑'],['昊陽','林浩筠'],['展毓','嚴毓棟']
    ],
    '桃竹':[
      ['瑞峰','蕭莉婷'],['躍昇','許又臻'],['瑞至','黃欣至'],['亞威','周淑娥'],['皇城','孫國城'],['金峰','呂秋蓉'],['新竹直轄','沈秋吟'],['虹燁','許雅虹']
    ],
    '中嘉':[
      ['福鵬直轄','黃傑揚'],['菁業','陳菁亮'],['上慶','邱慧娟'],['嘉銓','楊嘉麗'],['禾順','陳尹婷'],['保富','呂敏忠']],
    '台南':[
      ['立捷','蘇雅俐'],['金美','樊光美'],['金達','洪淑娟'],['松慶','廖樹松']
    ],
    '高屏':[
      ['彩榮','梁麗琴'],['宏慶','陳澤坤'],['韋誠','沈鳳英'],['順誠','張婄吟']]
  };
const form=document.getElementById('survey'),status=document.getElementById('status');
const qs=['本次工作坊整體滿意程度？','本次工作坊的個案分享、同儕交流及引導師回饋，對您在通訊處經營上的幫助程度？'];
document.getElementById('ratingQuestions').innerHTML=qs.map((q,i)=>'<div class="question"><label id="q'+i+'">'+(i+1)+'. '+q+' <span class="required">*</span></label><div class="scale" role="group" aria-labelledby="q'+i+'">'+[5,4,3,2,1].map(n=>'<input required type="radio" name="rating'+i+'" id="r'+i+'-'+n+'" value="'+n+'"><label for="r'+i+'-'+n+'">'+n+'</label>').join('')+'</div><div class="reason" id="reason'+i+'" hidden><label for="reasonText'+i+'">請簡單說明評分原因 <span class="required">*</span></label><textarea id="reasonText'+i+'" name="reason'+i+'" placeholder="請分享原因，協助我們持續改善……"></textarea></div></div>').join('');
const center=document.getElementById('center'),participant=document.getElementById('participant'),unit=document.getElementById('unit'),name=document.getElementById('name');
center.addEventListener('change',()=>{participant.innerHTML='<option value="">請選擇通訊處／姓名</option>';unit.value='';name.value='';const list=rosterByRegion[center.value]||[];participant.disabled=!list.length;list.forEach(([u,n],i)=>participant.add(new Option(u+'｜'+n,String(i))))});
participant.addEventListener('change',()=>{const row=(rosterByRegion[center.value]||[])[Number(participant.value)];if(participant.value!==''&&row){unit.value=row[0];name.value=row[1]}else{unit.value='';name.value=''}});
document.querySelectorAll('.scale').forEach((el,i)=>el.addEventListener('change',()=>{const n=Number(new FormData(form).get('rating'+i));const area=document.getElementById('reason'+i);area.hidden=n>3;area.querySelector('textarea').required=n<=3}));
const ENDPOINT='';
form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;if(!ENDPOINT){status.textContent='問卷接收端尚未啟用，請先完成後台串接。';return}const btn=form.querySelector('[type=submit]');btn.disabled=true;try{const data=Object.fromEntries(new FormData(form));const response=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!response.ok)throw new Error('HTTP '+response.status);form.innerHTML='<div style="text-align:center;padding:40px 10px"><h2>謝謝您的回饋！</h2><p>問卷已送出。</p></div>'}catch(err){status.textContent='送出失敗，請稍後再試。'}finally{btn.disabled=false}});
</script></body></html>
