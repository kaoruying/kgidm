function server(name,...args){

// 相片增亮、提升對比、輕微銳化；所有處理都在學員手機完成，Drive 保存處理後照片。
function loadImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{URL.revokeObjectURL(url);resolve(im)};im.onerror=()=>{URL.revokeObjectURL(url);reject(Error('無法讀取圖片'))};im.src=url})}
async function enhancePhoto(file){
 if(!file||!file.type.startsWith('image/'))throw Error('請選擇照片');
 const img=await loadImage(file);const max=1600;const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
 const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
 const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
 const ctx=canvas.getContext('2d',{willReadFrequently:true});
 ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.filter='brightness(1.10) contrast(1.08) saturate(1.03)';ctx.drawImage(img,0,0,w,h);ctx.filter='none';
 // 輕微邊緣加強：避免過度銳化造成手寫字筆畫破碎。
 if(w*h<=2400000){
   const imageData=ctx.getImageData(0,0,w,h),p=imageData.data,orig=new Uint8ClampedArray(p);
   for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
     const i=(y*w+x)*4;
     for(let c=0;c<3;c++){
       const center=orig[i+c];const avg=(orig[i-4+c]+orig[i+4+c]+orig[i-w*4+c]+orig[i+w*4+c])*.25;
       p[i+c]=Math.min(255,Math.max(0,center+(center-avg)*.18));
     }
   }
   ctx.putImageData(imageData,0,0);
 }
 let result=canvas.toDataURL('image/jpeg',.83);
 for(const q of [.75,.65,.55]){if(result.length<1250000)break;result=canvas.toDataURL('image/jpeg',q)}
 if(result.length>=1250000)throw Error('照片檔案較大，請換一張照片再試');
 return result;
}

 };

// 大螢幕：12張照片的獨立游動、自然換入、照片避讓；不改動 Google Drive 與上傳流程。
function initDisplay(){
 const canvas=el('swimCanvas'),stage=el('stage'),ctx=canvas.getContext('2d',{alpha:true});
 let W=0,H=0,dpr=1;
 let cardStates=new Map(),order=[],visible=[];
 let last=performance.now(),clock=0,lastSwap=performance.now(),rotationCursor=0;
 let loading=new Set(),queued=new Set(),fetchQueue=[],inFlight=0;
 let polling=false,firstPoll=true,lastRevision=null,pollErrors=0,backoffUntil=0;
 let transitioning=false,pending=[],knownVersion=0;
 const rand=(a,b)=>a+Math.random()*(b-a);
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 // 16:9投影幕同時12張；小螢幕則依可用空間自動縮減，不讓照片堆疊。
 const visibleLimit=()=>W>=1030&&H>=580?12:W>=720?8:5;
 function field(){return {left:W*.055,right:W*.945,top:Math.max(150,H*.288),bottom:H*.922}}
 function scaleBase(){return clamp(Math.min(W/1660,H/910),.56,1.18)}
 function tierSize(tier){
   const s=scaleBase();
   if(tier===0)return {w:240*s,h:158*s};
   if(tier===1)return {w:194*s,h:130*s};
   return {w:150*s,h:102*s};
 }
 function resize(){
  const r=stage.getBoundingClientRect();W=Math.max(300,r.width);H=Math.max(300,r.height);
  dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
  const f=field();for(const c of visible){c.x=clamp(c.x,f.left+c.w/2+20,f.right-c.w/2-20);c.y=clamp(c.y,f.top+c.h/2+20,f.bottom-c.h/2-20)}
  assignTiers();
 }
 addEventListener('resize',resize);resize();
 function assignTiers(){
  const active=visible.filter(c=>!c.exit).sort((a,b)=>b.shownAt-a.shownAt);
  // 最近加入的3張較大、接續5張中型，其餘4張遠景；每張都會輪流成為主視覺。
  active.forEach((c,i)=>{const t=i<3?0:i<8?1:2;const sz=tierSize(t);c.tier=t;c.targetW=sz.w;c.targetH=sz.h});
 }
 function overlapsAt(x,y,w,h,other,margin=20){
  const ow=other.targetW||other.w,oh=other.targetH||other.h;
  // 加入旋轉預留空間，確保斜放的卡片也不會互蓋。
  return Math.abs(other.x-x)<(w+ow)/2+margin && Math.abs(other.y-y)<(h+oh)/2+margin;
 }
 function locate(w,h){
  const f=field();let best=null,bestPenalty=Infinity;
  for(let i=0;i<420;i++){
    const x=rand(f.left+w/2+20,f.right-w/2-20),y=rand(f.top+h/2+20,f.bottom-h/2-20);
    let p=0;for(const c of visible){if(c.exit)continue;
      const dx=(w+(c.targetW||c.w))/2+23-Math.abs(c.x-x);
      const dy=(h+(c.targetH||c.h))/2+23-Math.abs(c.y-y);
      if(dx>0&&dy>0)p+=dx*dy;
    }
    // 輕微偏好有呼吸感的中心區域，但不強迫排成固定列。
    if(p<bestPenalty){bestPenalty=p;best={x,y}}if(p===0)break;
  }
  return best||{x:W*.5,y:H*.62};
 }
 function removeNow(c){visible=visible.filter(x=>x!==c);c.exit=false;assignTiers()}
 function enter(c,isNew){
  if(!c||visible.includes(c))return false;
  const base=tierSize(1), spot=locate(base.w,base.h),now=performance.now();
  Object.assign(c,{x:spot.x,y:spot.y,w:base.w,h:base.h,targetW:base.w,targetH:base.h,
   vx:rand(-21,21),vy:rand(-17,17),phase:rand(0,Math.PI*2),pace:rand(.7,1.22),
   speed:rand(19,32),angle:rand(-.045,.045),opacity:0,entry:now,shownAt:now,
   isNew:!!isNew,exit:false,exitAt:0,tier:1});
  visible.push(c);assignTiers();return true;
 }
 function queueEnter(c,isNew){
  if(!c||visible.includes(c)||pending.some(p=>p.card===c))return;
  const limit=visibleLimit();
  if(visible.length<limit&&!transitioning){enter(c,isNew);return}
  if(isNew)pending.unshift({card:c,isNew:true});else pending.push({card:c,isNew:false});
  triggerSwap();
 }
 function triggerSwap(){
  if(transitioning||!pending.length)return;
  if(visible.length<visibleLimit()){
    const item=pending.shift();enter(item.card,item.isNew);if(pending.length)triggerSwap();return;
  }
  const candidates=visible.filter(c=>!c.exit);
  if(!candidates.length)return;
  // 正在亮相的新卡片保留至少6秒，其餘輪流讓出舞台。
  const now=performance.now();candidates.sort((a,b)=>((now-a.shownAt)<6000?100000:0)+a.shownAt - (((now-b.shownAt)<6000?100000:0)+b.shownAt));
  const departing=candidates[0];departing.exit=true;departing.exitAt=now;transitioning=true;
  window.setTimeout(()=>{
    removeNow(departing);transitioning=false;
    // 被移出畫面的照片保留在記憶體中，之後仍可再輪播出現。
    if(pending.length){const next=pending.shift();if(order.includes(next.card.id))enter(next.card,next.isNew)}
    if(pending.length)triggerSwap();
  },860);
 }
 function drainImages(){
  while(inFlight<3&&fetchQueue.length){
   const item=fetchQueue.shift(),rec=item.rec;queued.delete(rec.id);
   if(cardStates.has(rec.id)||loading.has(rec.id)||!order.includes(rec.id))continue;
   loading.add(rec.id);inFlight++;
   server('getCardImage',rec.id).then(src=>{
    if(!src||!src.startsWith('data:image/')||!order.includes(rec.id))return;
    const img=new Image();img.onload=()=>{
      if(!order.includes(rec.id))return;
      const c={...rec,image:img};cardStates.set(rec.id,c);
      if(item.isNew||visible.length<visibleLimit())queueEnter(c,item.isNew);
    };img.onerror=()=>console.warn('照片讀取失敗',rec.id);img.src=src;
   }).catch(err=>console.warn('照片讀取失敗',err)).finally(()=>{inFlight--;loading.delete(rec.id);drainImages()});
  }
 }
 function loadPhoto(rec,isNew){
  if(cardStates.has(rec.id)||loading.has(rec.id)||queued.has(rec.id))return;
  queued.add(rec.id);if(isNew)fetchQueue.unshift({rec,isNew});else fetchQueue.push({rec,isNew});drainImages();
 }
 async function poll(){
  if(polling||document.hidden||performance.now()<backoffUntil)return;
  polling=true;
  try{
   const state=await server('getDisplayDelta',lastRevision);
   if(!state||typeof state!=='object')return;
   pollErrors=0;backoffUntil=0;if(state.unchanged)return;
   const recs=state.cards;if(!Array.isArray(recs))return;
   lastRevision=String(state.revision||'');
   const ids=new Set(recs.map(x=>x.id));
   order=recs.map(r=>r.id);
   for(const [id,c] of cardStates){if(!ids.has(id)){
       visible=visible.filter(v=>v!==c);cardStates.delete(id);
       pending=pending.filter(p=>p.card!==c);
   }}
   el('stageBlank').style.opacity=order.length?0:1;
   const unseen=recs.filter(r=>!cardStates.has(r.id)&&!loading.has(r.id));
   // 新照片優先進場；第一次載入則依上傳順序從頭開始。
   unseen.forEach(r=>loadPhoto(r,!firstPoll));
   firstPoll=false;assignTiers();
  }catch(err){
   pollErrors++;backoffUntil=performance.now()+Math.min(12000,1000*Math.pow(2,Math.min(pollErrors-1,4)));
   console.warn('展示資料讀取失敗，暫時放慢重試',err);
  }finally{polling=false}
 }
 function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
 function drawCard(c,now){
  if(!c.image||c.opacity<=.001)return;
  const w=c.w,h=c.h,enter=clamp((now-c.entry)/1200,0,1);
  const scale=.86+.14*(1-(1-enter)*(1-enter));
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle);ctx.scale(scale,scale);ctx.globalAlpha=clamp(c.opacity,0,1);
  ctx.shadowColor='rgba(3,12,32,.50)';ctx.shadowBlur=c.tier===0?24:17;ctx.shadowOffsetY=11;
  ctx.fillStyle='#fffaf3';roundRect(-w/2-5,-h/2-5,w+10,h+10,8);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.save();roundRect(-w/2,-h/2,w,h,4);ctx.clip();ctx.fillStyle='#f6f0e8';ctx.fillRect(-w/2,-h/2,w,h);
  const iw=c.image.naturalWidth||c.image.width,ih=c.image.naturalHeight||c.image.height;
  const r=Math.min(w/iw,h/ih),rw=iw*r,rh=ih*r;
  // 保留整張原始照片，不裁切、不重新輸出成電腦字。
  ctx.drawImage(c.image,-rw/2,-rh/2,rw,rh);ctx.restore();
  if(now-c.entry<4400){
    ctx.strokeStyle='rgba(255,216,145,'+(.52*Math.max(0,1-(now-c.entry)/4400))+')';
    ctx.lineWidth=2.8;roundRect(-w/2-8,-h/2-8,w+16,h+16,11);ctx.stroke();
  }
  ctx.restore();
 }
 function step(now){
  const dt=Math.min((now-last)/1000,.038);last=now;clock+=dt;
  ctx.clearRect(0,0,W,H);
  const f=field(),active=visible.filter(c=>c.image);
  for(const c of active){
    if(c.exit){c.opacity=Math.max(0,1-(now-c.exitAt)/820);continue}
    c.opacity=Math.min(1,c.opacity+dt*1.1);
    // 平滑調整成3張近景、5張中景、4張遠景，沒有固定格子或同方向移動。
    c.w+=(c.targetW-c.w)*Math.min(1,dt*1.35);c.h+=(c.targetH-c.h)*Math.min(1,dt*1.35);
    const desiredX=Math.sin(clock*.18*c.pace+c.phase)*c.speed+
                   Math.sin(clock*.11+c.phase*2.3)*c.speed*.35;
    const desiredY=Math.cos(clock*.23*c.pace+c.phase*1.4)*c.speed*.72+
                   Math.sin(clock*.12+c.phase*.8)*c.speed*.28;
    c.vx+=(desiredX-c.vx)*Math.min(1,dt*.47);
    c.vy+=(desiredY-c.vy)*Math.min(1,dt*.47);
    // 接近邊界即輕輕轉向，而非撞牆後瞬間反彈。
    const mx=Math.max(34,c.w*.65),my=Math.max(30,c.h*.7);
    if(c.x<f.left+mx)c.vx+=dt*(f.left+mx-c.x)*.85;
    if(c.x>f.right-mx)c.vx-=dt*(c.x-(f.right-mx))*.85;
    if(c.y<f.top+my)c.vy+=dt*(f.top+my-c.y)*1.0;
    if(c.y>f.bottom-my)c.vy-=dt*(c.y-(f.bottom-my))*1.0;
    c.x+=c.vx*dt;c.y+=c.vy*dt;
    c.angle=Math.sin(clock*.27+c.phase)*.048;
  }
  // 避讓系統：以含旋轉餘裕的安全框解決重疊。每張卡片始終可完整看見。
  for(let k=0;k<10;k++){
    let collisions=0;
    for(let i=0;i<active.length;i++)for(let j=i+1;j<active.length;j++){
      const a=active[i],b=active[j];if(a.exit||b.exit)continue;
      const dx=b.x-a.x,dy=b.y-a.y;
      const overX=(a.w+b.w)/2+21-Math.abs(dx),overY=(a.h+b.h)/2+19-Math.abs(dy);
      if(overX>0&&overY>0){collisions++;
        const sX=dx>=0?1:-1,sY=dy>=0?1:-1;
        if(overX<overY){const shift=(overX+1)*.52;a.x-=shift*sX;b.x+=shift*sX;a.vx-=sX*2;b.vx+=sX*2;}
        else{const shift=(overY+1)*.52;a.y-=shift*sY;b.y+=shift*sY;a.vy-=sY*2;b.vy+=sY*2;}
      }
    }
    for(const c of active){c.x=clamp(c.x,f.left+c.w*.5+13,f.right-c.w*.5-13);c.y=clamp(c.y,f.top+c.h*.5+13,f.bottom-c.h*.5-13)}
    if(!collisions)break;
  }
  active.sort((a,b)=>a.tier-b.tier); // 遠近層次；避讓後不會彼此蓋住。
  for(const c of active)drawCard(c,now);
  // 每4.5秒逐張輪換。若上傳不足12張，現有照片會持續游動，不會硬補空卡。
  if(now-lastSwap>4500&&!transitioning){
    lastSwap=now;
    if(order.length>visible.length){
      for(let ii=0;ii<order.length;ii++){
        const idx=(rotationCursor+ii)%order.length,candidate=cardStates.get(order[idx]);
        if(candidate&&!visible.includes(candidate)&&!pending.some(p=>p.card===candidate)){
          rotationCursor=(idx+1)%order.length;queueEnter(candidate,false);break;
        }
      }
    }
  }
  requestAnimationFrame(step);
 }
